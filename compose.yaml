name: monitoring-local
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  traccar:
    image: traccar/traccar:6.15.3-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://db:5432/monitoring
      DATABASE_USER: monitoring
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - ./infra/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
    ports:
      - "127.0.0.1:8082:8082"
      - "${TRACKER_BIND:-127.0.0.1}:${OSMAND_PORT:-5055}:5055/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/api/server || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging
  web:
    build: .
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
volumes:
  postgres-data:
  traccar-data:
  traccar-logs:
