name: Validate and smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: python3 scripts/configure.py
      - run: python3 -m unittest discover -s tests -p "test_installer.py" -v
      - run: docker compose config --quiet
      - run: bash -n install.sh scripts/backup.sh scripts/check.sh
      - run: python3 -m py_compile scripts/*.py
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail 150
      - if: always()
        run: docker compose down
